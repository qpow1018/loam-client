name: Windows Installer

on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run tauri:build:windows

      - name: Rename installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer was not found."
          }
          Copy-Item $installer.FullName "src-tauri/target/release/bundle/nsis/LoaM-windows.exe"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoaM-windows
          path: src-tauri/target/release/bundle/nsis/LoaM-windows.exe
          if-no-files-found: error
